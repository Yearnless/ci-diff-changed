name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run smoke test (fixture repo: renames, spaces, first commit, tags, invalid regex)
        run: bash scripts/smoke.sh

      - name: Self-test against live history (empty diff must report no changes)
        id: diff_empty
        uses: ./
        with:
          base-ref: 'HEAD'

      - name: Assert empty result
        env:
          HAS: ${{ steps.diff_empty.outputs.has_changes }}
          CHANGED: ${{ steps.diff_empty.outputs.changed_files }}
        run: |
          test "$HAS" = 'false'
          test "$CHANGED" = '[]'

      - name: Self-test against previous commit
        id: diff
        uses: ./
        with:
          base-ref: 'HEAD~1'

      - name: Assert output contract (JSON array + boolean flag, content-agnostic)
        env:
          HAS: ${{ steps.diff.outputs.has_changes }}
          CHANGED: ${{ steps.diff.outputs.changed_files }}
        run: |
          echo "$HAS" | grep -Eq '^(true|false)$'
          echo "$CHANGED" | jq -e 'type == "array"' >/dev/null
          if [ "$HAS" = 'true' ]; then
            test "$(echo "$CHANGED" | jq 'length')" -gt 0
          else
            test "$(echo "$CHANGED" | jq 'length')" -eq 0
          fi
